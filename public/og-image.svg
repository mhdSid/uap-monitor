<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="og-bg" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="og-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-anom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="30%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-arc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00ff88" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="og-arc2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Subtle globe grid on left -->
  <ellipse cx="320" cy="315" rx="200" ry="200" fill="none" stroke="#151515" stroke-width="0.8"/>
  <ellipse cx="320" cy="315" rx="130" ry="200" fill="none" stroke="#131313" stroke-width="0.6"/>
  <ellipse cx="320" cy="315" rx="55" ry="200" fill="none" stroke="#131313" stroke-width="0.5"/>
  <ellipse cx="320" cy="315" rx="200" ry="65" fill="none" stroke="#131313" stroke-width="0.6"/>
  <ellipse cx="320" cy="315" rx="200" ry="130" fill="none" stroke="#131313" stroke-width="0.5"/>

  <!-- Glow field -->
  <circle cx="320" cy="300" r="180" fill="url(#og-glow)"/>

  <!-- Orbital arcs -->
  <ellipse cx="320" cy="300" rx="160" ry="90" fill="none" stroke="url(#og-arc1)" stroke-width="1.5" transform="rotate(-20 320 300)"/>
  <ellipse cx="320" cy="300" rx="120" ry="70" fill="none" stroke="url(#og-arc2)" stroke-width="1.2" transform="rotate(25 320 300)"/>
  <ellipse cx="320" cy="310" rx="190" ry="55" fill="none" stroke="#00ff88" stroke-width="0.6" opacity="0.15" transform="rotate(-5 320 310)"/>

  <!-- Detection rings -->
  <circle cx="320" cy="290" r="45" fill="none" stroke="#00ff88" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.3"/>
  <circle cx="320" cy="290" r="28" fill="none" stroke="#00ff88" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Anomaly -->
  <circle cx="320" cy="290" r="10" fill="url(#og-anom)" opacity="0.6"/>
  <circle cx="320" cy="290" r="4" fill="#fff"/>

  <!-- Secondary signals -->
  <circle cx="210" cy="380" r="3" fill="#22d3ee" opacity="0.4"/>
  <circle cx="420" cy="220" r="2.5" fill="#a78bfa" opacity="0.35"/>
  <circle cx="390" cy="390" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="245" cy="215" r="2" fill="#22d3ee" opacity="0.25"/>

  <!-- Faint traces -->
  <line x1="320" y1="290" x2="210" y2="380" stroke="#22d3ee" stroke-width="0.4" opacity="0.1"/>
  <line x1="320" y1="290" x2="420" y2="220" stroke="#a78bfa" stroke-width="0.4" opacity="0.08"/>

  <!-- Crosshair -->
  <line x1="320" y1="272" x2="320" y2="279" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>
  <line x1="320" y1="301" x2="320" y2="308" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>
  <line x1="302" y1="290" x2="309" y2="290" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>
  <line x1="331" y1="290" x2="338" y2="290" stroke="#00ff88" stroke-width="0.5" opacity="0.4"/>

  <!-- Text block — right side -->
  <text x="600" y="275" font-family="'SF Mono','Menlo','Monaco','Courier New',monospace" font-size="56" font-weight="700" letter-spacing="8" fill="#e0e0e0">UAP MONITOR</text>
  <text x="600" y="320" font-family="'SF Mono','Menlo','Monaco','Courier New',monospace" font-size="16" letter-spacing="4" fill="#00ff88" opacity="0.7">OPEN-SOURCE INTELLIGENCE PLATFORM</text>

  <!-- Stats line -->
  <text x="600" y="380" font-family="'SF Mono','Menlo','Monaco','Courier New',monospace" font-size="13" letter-spacing="1" fill="#555">193K+ RECORDS  ·  12 SOURCES  ·  70 AD – PRESENT</text>

  <!-- Bottom border accent -->
  <rect x="0" y="624" width="1200" height="6" fill="#00ff88" opacity="0.15"/>
  <rect x="0" y="626" width="400" height="4" fill="#00ff88" opacity="0.3"/>
</svg>
