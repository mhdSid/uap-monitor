<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sig-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle scanlines -->
  <pattern id="scan" patternUnits="userSpaceOnUse" width="4" height="4">
    <rect width="4" height="1" fill="rgba(0,0,0,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- Globe — centered left of midpoint -->
  <g transform="translate(340, 280)">
    <!-- Globe outline -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>

    <!-- Latitude lines -->
    <ellipse cx="0" cy="0" rx="160" ry="48" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
    <ellipse cx="0" cy="0" rx="160" ry="100" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>

    <!-- Longitude lines -->
    <ellipse cx="0" cy="0" rx="48" ry="160" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
    <ellipse cx="0" cy="0" rx="100" ry="160" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#1a1a1a" stroke-width="0.8"/>

    <!-- Detection rings -->
    <circle cx="-20" cy="-30" r="65" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="6 3" opacity="0.4"/>
    <circle cx="-20" cy="-30" r="38" fill="none" stroke="#00ff41" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3"/>
    <circle cx="-20" cy="-30" r="16" fill="none" stroke="#00ff41" stroke-width="1.2" opacity="0.6"/>

    <!-- Primary anomaly -->
    <circle cx="-20" cy="-30" r="6" fill="url(#sig-pulse)"/>
    <circle cx="-20" cy="-30" r="2.5" fill="#00ff41"/>

    <!-- Secondary signal points -->
    <circle cx="80" cy="60" r="3" fill="#22d3ee" opacity="0.5"/>
    <circle cx="-90" cy="40" r="2.5" fill="#a78bfa" opacity="0.4"/>
    <circle cx="50" cy="-80" r="2" fill="#f59e0b" opacity="0.35"/>
    <circle cx="-60" cy="-90" r="2" fill="#22d3ee" opacity="0.3"/>
    <circle cx="110" cy="-20" r="1.5" fill="#f87171" opacity="0.3"/>

    <!-- Connecting traces -->
    <line x1="-20" y1="-30" x2="80" y2="60" stroke="#22d3ee" stroke-width="0.4" opacity="0.15"/>
    <line x1="-20" y1="-30" x2="-90" y2="40" stroke="#a78bfa" stroke-width="0.4" opacity="0.12"/>
    <line x1="-20" y1="-30" x2="50" y2="-80" stroke="#f59e0b" stroke-width="0.4" opacity="0.1"/>
  </g>

  <!-- Text block — right of globe -->
  <text x="620" y="245" font-family="'Menlo','Monaco','Courier New',monospace" font-size="52" font-weight="700" letter-spacing="8" fill="#e0e0e0">UAP MONITOR</text>
  <text x="620" y="290" font-family="'Menlo','Monaco','Courier New',monospace" font-size="16" letter-spacing="4" fill="#555">REAL-TIME SIGHTING INTELLIGENCE</text>

  <!-- Stats line -->
  <g transform="translate(620, 340)">
    <text font-family="'Menlo','Monaco','Courier New',monospace" font-size="12" letter-spacing="2">
      <tspan fill="#00ff41">147K</tspan>
      <tspan fill="#555"> REPORTS</tspan>
      <tspan fill="#333"> · </tspan>
      <tspan fill="#22d3ee">NUFORC</tspan>
      <tspan fill="#333"> · </tspan>
      <tspan fill="#a78bfa">OSINT</tspan>
      <tspan fill="#333"> · </tspan>
      <tspan fill="#f59e0b">PWA</tspan>
    </text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="#00ff41" opacity="0.15"/>
  <rect x="0" y="628" width="400" height="2" fill="#00ff41" opacity="0.4"/>
</svg>
