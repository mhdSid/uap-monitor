<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="globe-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00ff41" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#globe-grad)" stroke="#1e1e1e" stroke-width="2"/>

  <!-- Globe grid lines — latitude -->
  <ellipse cx="256" cy="256" rx="200" ry="200" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <ellipse cx="256" cy="256" rx="200" ry="130" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="256" y1="56" x2="256" y2="456" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Globe grid lines — longitude -->
  <ellipse cx="256" cy="256" rx="60" ry="200" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <ellipse cx="256" cy="256" rx="130" ry="200" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Anomaly detection rings -->
  <circle cx="256" cy="220" r="80" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <circle cx="256" cy="220" r="50" fill="none" stroke="url(#ring-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="256" cy="220" r="24" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.8"/>

  <!-- Central anomaly point -->
  <circle cx="256" cy="220" r="8" fill="url(#pulse)"/>
  <circle cx="256" cy="220" r="3.5" fill="#00ff41"/>

  <!-- Secondary signal points on globe -->
  <circle cx="170" cy="300" r="3" fill="#22d3ee" opacity="0.6"/>
  <circle cx="340" cy="180" r="2.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="310" cy="330" r="2" fill="#f59e0b" opacity="0.4"/>
  <circle cx="190" cy="170" r="2" fill="#22d3ee" opacity="0.3"/>

  <!-- Signal traces -->
  <line x1="256" y1="220" x2="170" y2="300" stroke="#22d3ee" stroke-width="0.5" opacity="0.2"/>
  <line x1="256" y1="220" x2="340" y2="180" stroke="#a78bfa" stroke-width="0.5" opacity="0.2"/>
  <line x1="256" y1="220" x2="310" y2="330" stroke="#f59e0b" stroke-width="0.5" opacity="0.15"/>

  <!-- UAP MON text arc at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Menlo','Monaco','Courier New',monospace" font-size="36" font-weight="700" letter-spacing="12" fill="#555">UAP</text>
</svg>
