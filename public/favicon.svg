<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark circle -->
  <circle cx="16" cy="16" r="15" fill="#0a0a0a" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Minimal globe grid -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#1e1e1e" stroke-width="0.8"/>
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>
  <ellipse cx="16" cy="16" rx="4" ry="12" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>

  <!-- Detection ring -->
  <circle cx="16" cy="14" r="5" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.6"/>

  <!-- Anomaly point -->
  <circle cx="16" cy="14" r="2" fill="#00ff41"/>

  <!-- Secondary signals -->
  <circle cx="11" cy="19" r="1" fill="#22d3ee" opacity="0.5"/>
  <circle cx="22" cy="12" r="0.8" fill="#a78bfa" opacity="0.4"/>
</svg>
