<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAP Monitor — Offline</title>
    <style>
      body{margin:0;background:#0a0a0a;font-family:'Menlo','Monaco','Cascadia Mono','Courier New',monospace;color:#555;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center}
      h1{font-size:14px;letter-spacing:4px;color:#c0c0c0;margin-bottom:12px}
      p{font-size:11px;letter-spacing:1px;max-width:320px;line-height:1.6}
      .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef4444;margin-right:6px}
      button{margin-top:20px;background:none;border:1px solid #333;color:#c0c0c0;font-family:inherit;font-size:10px;letter-spacing:1px;padding:6px 16px;cursor:pointer}
      button:hover{border-color:#00ff41;color:#00ff41}
    </style>
  </head>
  <body>
    <h1>UAP MONITOR</h1>
    <p><span class="dot"></span>SIGNAL LOST — NO NETWORK CONNECTION</p>
    <p>Cached data may still be available. Reconnect to resume live monitoring.</p>
    <button onclick="location.reload()">RETRY CONNECTION</button>
  </body>
</html>
