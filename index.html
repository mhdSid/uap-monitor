    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "UAP Monitor",
      "alternateName": "UAP MON",
      "url": "https://uapmonitor.org/",
      "description": "Global UAP intelligence platform aggregating 230,000+ sighting reports from 12 verified sources with credibility scoring and real-time news analysis.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web Browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "230,000+ UAP sighting records",
        "14 verified intelligence sources",
        "70 AD to present coverage",
        "Credibility scoring system",
        "Shape and pattern analysis",
        "Real-time GDELT and GNews feeds",
        "Region-grouped data grids",
        "Interactive sighting map"
      ],
      "keywords": "UAP, UFO, NUFORC, intelligence platform, sighting tracker"
    }
    </script>

    <style>
      body{margin:0;background:#0a0a0a;font-family:'Menlo','Monaco','Cascadia Mono','Courier New',monospace}
      .shell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#555}
      .shell svg{display:block;margin-bottom:16px}
      .shell__hand{transform-origin:40px 40px;animation:rs 2s linear infinite}
      .shell__text{font-size:11px;letter-spacing:2px}
      @keyframes rs{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="shell" aria-label="Loading UAP Monitor">
        <svg viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-hidden="true">
          <circle cx="40" cy="40" r="36" stroke="#1e1e1e" stroke-width="1"/>
          <circle cx="40" cy="40" r="24" stroke="#1e1e1e" stroke-width="1"/>
          <circle cx="40" cy="40" r="12" stroke="#1e1e1e" stroke-width="1"/>
          <circle cx="40" cy="40" r="2.5" fill="#00ff41"/>
          <line x1="40" y1="40" x2="40" y2="6" stroke="#00ff41" stroke-width="1.5" stroke-linecap="round" class="shell__hand"/>
        </svg>
        <div class="shell__text">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
